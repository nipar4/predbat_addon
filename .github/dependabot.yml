version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/predbat"
    schedule:
      interval: "weekly"
    groups:
      docker-base:
        patterns: ["*"]

  # Python deps for the alpine/slim/noble images: requirements.txt is the
  # readable list, requirements.lock the hashed pins the Dockerfiles install
  - package-ecosystem: "pip"
    directory: "/predbat"
    schedule:
      interval: "weekly"
    ignore:
      # Follow upstream Predbat's pins (batpred requirements.txt: numpy==2.3.5,
      # ruamel.yaml unpinned); bump by hand when upstream does (homelab #471, #472)
      - dependency-name: "numpy"
      - dependency-name: "ruamel.yaml"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]