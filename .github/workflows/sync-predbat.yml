name: Sync Upstream Predbat Release

on:
  schedule:
    - cron: '0 * * * *'   
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'predbat/requirements.txt'
      - 'versions.env'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Let the running build finish; queue rather than kill

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version_changed: ${{ steps.compare.outputs.changed }}
      new_version: ${{ steps.upstream.outputs.tag }}
      addon_version: ${{ steps.addon_version.outputs.addon_version }}
      s6_version: ${{ steps.s6_version.outputs.s6_version }}
      commit_sha: ${{ steps.push.outputs.sha }}
      predbat_sha: ${{ steps.predbat_sha.outputs.sha }}
      addon_current: ${{ steps.addon_check.outputs.addon_current }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get latest upstream release tag
        id: upstream
        run: |
          set -euo pipefail
          LATEST=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/springfall2008/batpred/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "Failed to fetch latest upstream release tag"
            exit 1
          fi
          echo "Latest upstream release: $LATEST"
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"

      # The build fetches Predbat by this commit, not by the tag, so a tag
      # moved after the fact cannot change what the image ships (D6)
      - name: Resolve upstream release tag to a commit
        id: predbat_sha
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.tag }}"
          repo=https://github.com/springfall2008/batpred.git
          sha=$(git ls-remote "$repo" "refs/tags/${tag}^{}" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote "$repo" "refs/tags/${tag}" | cut -f1)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve Predbat tag ${tag} to a commit (got '${sha}')"
            exit 1
          fi
          echo "Predbat ${tag} = ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Read current version
        id: current
        run: |
          source versions.env
          PREDBAT_VERSION_CLEAN=$(echo "$PREDBAT_VERSION" | tr -d '[:space:]')
          echo "Current version: $PREDBAT_VERSION_CLEAN"
          echo "predbat_version=$PREDBAT_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Read addon version
        id: addon_version
        run: |
          source versions.env
          ADDON_VERSION_CLEAN=$(echo "$ADDON_VERSION" | tr -d '[:space:]')
          echo "Addon version: $ADDON_VERSION_CLEAN"
          echo "addon_version=$ADDON_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Read s6 version
        id: s6_version
        run: |
          source versions.env
          S6_VERSION_CLEAN=$(echo "$S6_VERSION" | tr -d '[:space:]')
          echo "S6 version: $S6_VERSION_CLEAN"
          echo "s6_version=$S6_VERSION_CLEAN" >> "$GITHUB_OUTPUT"

      - name: Check addon is current
        id: addon_check
        run: |
          set -euo pipefail
          LATEST_ADDON=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/springfall2008/predbat_addon/releases/latest \
            | jq -r '.tag_name')
          if [ -z "$LATEST_ADDON" ] || [ "$LATEST_ADDON" = "null" ]; then
            echo "Failed to fetch latest upstream addon release tag"
            exit 1
          fi
          if [ "$LATEST_ADDON" != "${{ steps.addon_version.outputs.addon_version }}" ]; then
            echo "Addon out of date: have ${{ steps.addon_version.outputs.addon_version }}, upstream is $LATEST_ADDON - skipping build until addon sync catches up"
            echo "addon_current=false" >> "$GITHUB_OUTPUT"
          else
            echo "addon_current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compare versions
        id: compare
        run: |
          if [ "${{ steps.upstream.outputs.tag }}" != "${{ steps.current.outputs.predbat_version }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update version file
        if: steps.compare.outputs.changed == 'true'
        run: |
          sed -i "s/^PREDBAT_VERSION=.*/PREDBAT_VERSION=${{ steps.upstream.outputs.tag }}/" versions.env
          echo "Updated versions.env to ${{ steps.upstream.outputs.tag }}"

      - name: Commit and push updated version
        id: push
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add versions.env
          git commit -m "chore: bump predbat version to ${{ steps.upstream.outputs.tag }}"
          git pull --rebase
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: check-and-sync
    if: github.event_name == 'workflow_dispatch' || (needs.check-and-sync.outputs.addon_current == 'true' && needs.check-and-sync.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            dockerfile: Dockerfile.noble
            tag_suffix: ""
          - variant: alpine
            dockerfile: Dockerfile.alpine
            tag_suffix: "alpine-"
          - variant: slim
            dockerfile: Dockerfile.slim
            tag_suffix: "slim-"

    env:
      USER: ${{ secrets.DOCKERHUB_USERNAME }}
      PREDBAT_VERSION: ${{ needs.check-and-sync.outputs.new_version }}
      PREDBAT_SHA: ${{ needs.check-and-sync.outputs.predbat_sha }}
      ADDON_VERSION: ${{ needs.check-and-sync.outputs.addon_version }}
      S6_VERSION: ${{ needs.check-and-sync.outputs.s6_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-and-sync.outputs.commit_sha || github.sha }}

      - name: Validate version
        run: |
          [ -n "${{ env.PREDBAT_VERSION }}" ] || { echo "Empty predbat version!"; exit 1; }
          [ -n "${{ env.PREDBAT_SHA }}" ] || { echo "Empty predbat commit SHA!"; exit 1; }
          [ -n "${{ env.ADDON_VERSION }}" ] || { echo "Empty addon version!"; exit 1; }
          [ -n "${{ env.S6_VERSION }}" ] || { echo "Empty s6 version!"; exit 1; }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "value=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          
      - name: Build and push ${{ matrix.variant }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./predbat/
          file: ./predbat/${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.USER }}/predbat_addon:${{ matrix.tag_suffix }}latest
            ${{ env.USER }}/predbat_addon:${{ matrix.tag_suffix }}${{ env.PREDBAT_VERSION }}
          build-args: |
            BUILD_DATE=${{ steps.date.outputs.value }}
            PREDBAT_VERSION=${{ env.PREDBAT_VERSION }}
            PREDBAT_SHA=${{ env.PREDBAT_SHA }}
            ADDON_VERSION=${{ env.ADDON_VERSION }}
            S6_VERSION=${{ env.S6_VERSION }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
          provenance: true
          sbom: true

  # Post-publish scan (D2/D3). Runs after the images are pushed and never
  # gates anything: release keeps needs: [check-and-sync, build] only. A
  # fixable CRITICAL/HIGH finding fails this job, and GitHub's failed-run
  # email is the alert; the next release or a manual rebuild fixes it.
  scan:
    needs: [check-and-sync, build]
    if: github.event_name == 'workflow_dispatch' || (needs.check-and-sync.outputs.addon_current == 'true' && needs.check-and-sync.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: noble
            tag_suffix: ""
          - variant: alpine
            tag_suffix: "alpine-"
          - variant: slim
            tag_suffix: "slim-"

    env:
      USER: ${{ secrets.DOCKERHUB_USERNAME }}
      PREDBAT_VERSION: ${{ needs.check-and-sync.outputs.new_version }}
      TRIVY_PLATFORM: linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-and-sync.outputs.commit_sha || github.sha }}

      # Report for the Security tab: CRITICAL/HIGH including unfixed ones, so
      # they are listed there without raising an alert. Never fails the job.
      - name: Trivy report (${{ matrix.variant }}, SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.USER }}/predbat_addon:${{ matrix.tag_suffix }}${{ env.PREDBAT_VERSION }}
          format: sarif
          output: trivy-${{ matrix.variant }}.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          trivyignores: predbat/.trivyignore
          exit-code: '0'

      - name: Upload SARIF to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: trivy-${{ matrix.variant }}.sarif
          category: trivy-${{ matrix.variant }}

      # The alert: fixable CRITICAL/HIGH only (D3). exit-code 1 fails this job.
      - name: Trivy gate (${{ matrix.variant }}, fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.USER }}/predbat_addon:${{ matrix.tag_suffix }}${{ env.PREDBAT_VERSION }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: predbat/.trivyignore
          exit-code: '1'

  release:
    needs: [check-and-sync, build]
    if: github.event_name == 'workflow_dispatch' || (needs.check-and-sync.outputs.addon_current == 'true' && needs.check-and-sync.outputs.version_changed == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      PREDBAT_VERSION: ${{ needs.check-and-sync.outputs.new_version }}
      ADDON_VERSION: ${{ needs.check-and-sync.outputs.addon_version }}

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.PREDBAT_VERSION }}
          name: Based on Predbat Version ${{ env.PREDBAT_VERSION }}
          body: |
            🔧 Built with predbat version `${{ env.PREDBAT_VERSION }}`
            📦 Addon base version `${{ env.ADDON_VERSION }}`