name: Lint, Build & Boot Test

on:
  # &paths/*paths keeps the pull_request and push trigger lists in sync
  pull_request:
    paths: &paths
      - 'predbat/Dockerfile.alpine'
      - 'predbat/Dockerfile.noble'
      - 'predbat/Dockerfile.slim'
      - 'predbat/rootfs/**'
      - 'predbat/requirements.txt'
      - 'predbat/requirements.lock'
      - 'predbat/.trivyignore'
      - 'versions.env'
      - '.github/workflows/lint-build-boot-test.yml'
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Dockerfiles & scripts (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, noble, slim]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Hadolint - Dockerfile.${{ matrix.variant }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: predbat/Dockerfile.${{ matrix.variant }}

      - name: Shellcheck rootfs scripts
        run: |
          shopt -s globstar nullglob
          files=(predbat/**/*.sh)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found, skipping"
            exit 0
          fi
          shellcheck "${files[@]}"

  build-and-boot:
    name: Build & boot test (${{ matrix.variant }} / ${{ matrix.platform }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, noble, slim]
        platform: [linux/amd64, linux/arm64]
        include:
          # linux/arm64 runs under QEMU emulation on these amd64 runners, so
          # Predbat's startup takes much longer to reach the config-check prompt.
          - platform: linux/amd64
            boot_timeout: 90
            start_timeout: 120
          - platform: linux/arm64
            boot_timeout: 240
            start_timeout: 300
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read versions.env
        id: versions
        run: |
          source versions.env
          {
            echo "predbat_version=$(echo "$PREDBAT_VERSION" | tr -d '[:space:]')"
            echo "addon_version=$(echo "$ADDON_VERSION" | tr -d '[:space:]')"
            echo "s6_version=$(echo "$S6_VERSION" | tr -d '[:space:]')"
            echo "s6_sha256_noarch=$(echo "$S6_SHA256_NOARCH" | tr -d '[:space:]')"
            echo "s6_sha256_amd64=$(echo "$S6_SHA256_AMD64" | tr -d '[:space:]')"
            echo "s6_sha256_arm64=$(echo "$S6_SHA256_ARM64" | tr -d '[:space:]')"
            echo "s6_sha256_arm=$(echo "$S6_SHA256_ARM" | tr -d '[:space:]')"
          } >> "$GITHUB_OUTPUT"

      # Build from the commit the PREDBAT_VERSION tag points at, not the tag (D6)
      - name: Resolve Predbat commit
        id: predbat_sha
        run: |
          set -euo pipefail
          tag="${{ steps.versions.outputs.predbat_version }}"
          repo=https://github.com/springfall2008/batpred.git
          sha=$(git ls-remote "$repo" "refs/tags/${tag}^{}" | cut -f1)
          [ -n "$sha" ] || sha=$(git ls-remote "$repo" "refs/tags/${tag}" | cut -f1)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve Predbat tag ${tag} to a commit (got '${sha}')"
            exit 1
          fi
          echo "Predbat ${tag} = ${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./predbat/
          file: ./predbat/Dockerfile.${{ matrix.variant }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: predbat-addon-test:${{ matrix.variant }}
          build-args: |
            PREDBAT_VERSION=${{ steps.versions.outputs.predbat_version }}
            PREDBAT_SHA=${{ steps.predbat_sha.outputs.sha }}
            ADDON_VERSION=${{ steps.versions.outputs.addon_version }}
            S6_VERSION=${{ steps.versions.outputs.s6_version }}
            S6_SHA256_NOARCH=${{ steps.versions.outputs.s6_sha256_noarch }}
            S6_SHA256_AMD64=${{ steps.versions.outputs.s6_sha256_amd64 }}
            S6_SHA256_ARM64=${{ steps.versions.outputs.s6_sha256_arm64 }}
            S6_SHA256_ARM=${{ steps.versions.outputs.s6_sha256_arm }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }},mode=max

      - name: Boot test
        run: |
          predbat/scripts/build-boot-test.sh ${{ matrix.variant }} \
            --tag predbat-addon-test:${{ matrix.variant }} \
            --platform ${{ matrix.platform }} \
            --timeout ${{ matrix.boot_timeout }} \
            --start-timeout ${{ matrix.start_timeout }}

      # Same thresholds and ignore file as the post-publish scan in
      # sync-predbat.yml (D3): fail on fixable CRITICAL/HIGH only. A red step
      # here shows the finding on the PR; it is not a required check, so it
      # never blocks a merge (D2). amd64 only, like the post-publish scan.
      - name: Trivy scan (${{ matrix.variant }})
        if: matrix.platform == 'linux/amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: predbat-addon-test:${{ matrix.variant }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: predbat/.trivyignore
          exit-code: '1'
