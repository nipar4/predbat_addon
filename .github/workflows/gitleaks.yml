name: Secret Scan

# Public repo: scan the whole git history for committed secrets on every push to main and every PR.
# No image build or publish is triggered by this file (the build workflows filter on their own paths).
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history, not just the pushed commits

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-connrefused --retry-all-errors -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version

      # --redact keeps any finding's value out of the (public) log.
      - name: Scan the full git history
        run: /tmp/gitleaks git . --redact --no-banner -v
